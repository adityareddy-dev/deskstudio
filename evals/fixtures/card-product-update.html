<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Studio product update</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0b0b0c}
body{font-family:Geist,Inter,Arial,sans-serif;color:#f4f4f5;-webkit-font-smoothing:antialiased}
main[data-artboard]{position:relative;width:100vw;height:100vh;overflow:hidden;background:#0b0b0c}
/* linkedin: frame 38 outside, 2px rule, 56 inside, text block top at 96 */
.frame{position:absolute;left:38px;right:38px;top:38px;bottom:56px;border:2px solid #8a8a93;
  display:flex;flex-direction:column;justify-content:flex-start;padding:56px 56px 0}
h1{font-weight:600;font-size:95.37px;line-height:1.05;letter-spacing:-0.02em}
h1 span{display:block}
h1 .go{color:#ffb000}
.sub{font-weight:400;font-size:39.06px;line-height:1.3;margin-top:40px;color:#f4f4f5}
.mark{position:absolute;left:56px;bottom:0;transform:translateY(50%);background:#0b0b0c;padding:0 16px;
  font-weight:600;font-size:25px;line-height:1;color:#f4f4f5;margin-left:-16px}
/* portrait: frame 70 outside so the text column sits at x 128, supporting line bottom at y 1132, mark on the bottom rule */
@media (max-aspect-ratio:1/1){
  .frame{left:70px;right:70px;top:72px;bottom:160px;padding:128px 56px 56px;justify-content:space-between}
  .sub{margin-top:0}
}
</style>
</head>
<body>
<main data-artboard>
  <div class="frame">
    <h1><span>Pause a job.</span><span>Swap the model.</span><span class="go">Continue.</span></h1>
    <p class="sub">The floor is yours.</p>
    <div class="mark">deskstudio.ai</div>
  </div>
</main>
</body>
</html>
