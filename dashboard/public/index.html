<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Desk Studio dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%231d150e%22/%3E%3Crect x=%229%22 y=%2213%22 width=%2246%22 height=%2238%22 rx=%2214%22 fill=%22%23f6e9d6%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2213%22 fill=%22%232a1f18%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%228.4%22 fill=%22none%22 stroke=%22%23ffaa1c%22 stroke-width=%224%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%223.8%22 fill=%22%23120d09%22/%3E%3Ccircle cx=%2235.6%22 cy=%2228.2%22 r=%222.2%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="bots.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="bot-defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="bot-head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-hi"/><stop offset=".6" class="s-mid"/><stop offset="1" class="s-lo"/></linearGradient>
    <linearGradient id="bot-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-mid"/><stop offset="1" class="s-lo"/></linearGradient>
  </defs>
</svg>

<header class="top">
  <a class="brand" href="./" aria-label="Desk Studio dashboard">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1d150e"/><rect x="9" y="13" width="46" height="38" rx="14" fill="#f6e9d6"/><rect x="9" y="38" width="46" height="13" rx="6" fill="#e3cfb2" opacity=".7"/><circle cx="32" cy="32" r="13" fill="#2a1f18"/><circle cx="32" cy="32" r="8.4" fill="none" stroke="#ffaa1c" stroke-width="4"/><circle cx="32" cy="32" r="3.8" fill="#120d09"/><circle cx="35.6" cy="28.2" r="2.2" fill="#fff"/></svg>
    <span class="wordmark">Desk Studio</span>
  </a>
  <span class="project" id="projectName"></span>
  <div class="top-right">
    <label class="jobpick"><span>Job</span> <select id="jobSelect" aria-label="Job"></select></label>
    <span id="conn" class="live" title="Not connected"><i class="dot"></i><span class="live-text">Offline</span></span>
    <button id="scheme" class="ghost small" type="button">Light</button>
  </div>
</header>

<main class="studio">
  <section id="banner" class="banner" hidden></section>
  <section class="job" id="job"><p class="muted">Loading.</p></section>
  <div class="split">
    <section class="panel floor" id="floor"><p class="muted">Loading.</p></section>
    <div class="side">
      <section class="panel now" id="now"></section>
      <section class="panel feed" id="feed"></section>
    </div>
  </div>
  <section class="panel board" id="board"></section>
  <div class="split2">
    <section class="panel ledger" id="ledger"></section>
    <section class="panel memory" id="memory"></section>
  </div>
</main>

<aside id="sheet" class="sheet" hidden></aside>
<div id="toast" class="toast" role="status" hidden></div>
<div id="confetti" class="confetti" aria-hidden="true"></div>

<script src="bots.js"></script>
<script src="app.js"></script>
</body>
</html>
